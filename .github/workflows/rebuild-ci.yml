name: rebuild-ci

# CI for the rebuild. The POC has its own deploy.yml.
# The gate is `pnpm run check`, the same command the pre-push hook runs (AGENTS.md), so CI and a
# local push cannot disagree. Solo dev: the pull request is the gate, no nightly schedule (ADR-0006).
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browsers the characterisation suite drives
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Gate
        run: pnpm run check
